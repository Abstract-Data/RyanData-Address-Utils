repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, src/, tests/]
      - id: ruff-format
        args: [src/, tests/]

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest
        entry: uv run pytest --cov=src/ryandata_address_utils --cov-report=xml:coverage.xml
        language: system
        pass_filenames: false
        always_run: true

      - id: diff-coverage
        name: diff coverage (new/changed lines must be tested)
        entry: scripts/check-diff-coverage.sh
        language: system
        pass_filenames: false
        always_run: true
