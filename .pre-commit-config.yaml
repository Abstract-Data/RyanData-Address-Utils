repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      # `uv run ruff`, not the astral-sh/ruff-pre-commit mirror: that repo pins its own
      # ruff version independently of pyproject.toml's `ruff` dev dependency, so it
      # silently drifts from what CI's lint.yml actually runs (`uv run ruff` too) —
      # exactly the mismatch that let a formatting issue pass locally and fail in CI.
      # Routing both through the same uv-managed ruff makes that structurally impossible.
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix src/ tests/
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format src/ tests/
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-unit
        name: pytest
        entry: uv run pytest --cov=src/ryandata_address_utils --cov-report=xml:coverage.xml
        language: system
        pass_filenames: false
        always_run: true

      - id: diff-coverage
        name: diff coverage (new/changed lines must be tested)
        entry: scripts/check-diff-coverage.sh
        language: system
        pass_filenames: false
        always_run: true
